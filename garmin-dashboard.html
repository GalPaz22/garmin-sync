<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>סנכרון גארמין</title>
<style>
  :root {
    --bg: #0b0e14;
    --text: #e8eef6;
    --muted: #7d8899;
    --accent: #2f81f7;
    --accent-hot: #1f6feb;
    --ok: #3fb950;
    --err: #f85149;
    --line: #232a35;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 32px 16px;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }

  .store { color: var(--muted); font-size: 0.95rem; }
  .store strong { color: var(--text); font-weight: 600; }

  /* The button is the page. */
  #syncBtn {
    width: min(78vw, 300px);
    height: min(78vw, 300px);
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-size: clamp(2.2rem, 9vw, 3.4rem);
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 18px 50px -12px rgba(47, 129, 247, 0.5);
    transition: background .18s, transform .12s, box-shadow .25s;
  }
  #syncBtn:hover:not(:disabled) { background: var(--accent-hot); }
  #syncBtn:active:not(:disabled) { transform: scale(0.97); }
  #syncBtn:focus-visible { outline: 3px solid #fff; outline-offset: 6px; }
  #syncBtn:disabled { cursor: not-allowed; }

  /* Running: a slow pulse, so a long run never looks frozen. */
  #syncBtn.running {
    background: #243447;
    color: var(--muted);
    font-size: clamp(1.4rem, 5.5vw, 2rem);
    animation: pulse 1.9s ease-in-out infinite;
    box-shadow: none;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(47, 129, 247, 0.30); }
    50%      { box-shadow: 0 0 0 26px rgba(47, 129, 247, 0); }
  }
  #syncBtn.done { background: var(--ok); box-shadow: 0 18px 50px -12px rgba(63, 185, 80, 0.5); }
  #syncBtn.failed { background: var(--err); box-shadow: 0 18px 50px -12px rgba(248, 81, 73, 0.5); }
  #syncBtn.blocked { background: #243447; color: var(--muted); box-shadow: none; }

  @media (prefers-reduced-motion: reduce) {
    #syncBtn { transition: none; }
    #syncBtn.running { animation: none; }
  }

  #status { font-size: 1.05rem; min-height: 1.6em; max-width: 30rem; line-height: 1.6; }
  #status.err { color: var(--err); }
  #status.ok { color: var(--ok); }

  .meta { color: var(--muted); font-size: 0.85rem; }

  /* Tucked away — only reached when a run needs explaining. */
  .logToggle {
    background: none; border: none; color: var(--muted); font-family: inherit;
    font-size: 0.82rem; cursor: pointer; text-decoration: underline; padding: 4px;
  }
  .logToggle:hover { color: var(--text); }
  #logs {
    display: none;
    width: min(94vw, 760px);
    max-height: 320px;
    overflow: auto;
    background: #070a0f;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    direction: ltr;
    text-align: left;
    font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
    font-size: 0.78rem;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    color: #c6d0dc;
  }
  #logs.show { display: block; }
</style>
</head>
<body>

  <p class="store" id="store">&nbsp;</p>

  <button id="syncBtn" disabled>סנכרן</button>

  <p id="status">בודק מצב…</p>

  <p class="meta" id="meta">&nbsp;</p>

  <button class="logToggle" id="logToggle" hidden>הצג יומן</button>
  <pre id="logs"></pre>

<script>
const $ = id => document.getElementById(id);

// Where the service lives when the page was not served by it (opened from disk).
const DEPLOYED_URL = 'https://garmin-sync-75yx.onrender.com';
const BASE = /^https?:$/.test(location.protocol) ? location.origin : DEPLOYED_URL;

// Only used when the service runs with SYNC_TOKEN set; the page then carries it
// in the link, so nothing has to be typed here either.
const TOKEN = new URLSearchParams(location.search).get('token') || '';

let pollTimer = null;
// True once this page has actually watched a run go by. A stored "done" from
// hours ago must not paint the button green on load, or it reads as though the
// sync just happened — or worse, as though it has already been pressed.
let watchedRun = false;

async function api(path, options = {}) {
  const url = BASE + path + (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : '');
  const response = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.error || ('שגיאה ' + response.status));
  return body;
}

const formatTime = value => value ? new Date(value).toLocaleString('he-IL') : null;

function setButton(mode, label) {
  const button = $('syncBtn');
  button.className = mode === 'idle' ? '' : mode;
  button.disabled = mode === 'running' || mode === 'blocked';
  button.textContent = label;
}

function setStatus(text, tone = '') {
  $('status').textContent = text;
  $('status').className = tone;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
}

function render(status) {
  const running = status.running || status.state === 'running' || status.state === 'processing';

  // Name the store, so it is never a mystery what the button acts on.
  if (status.storeFound && status.store) {
    const store = status.store;
    $('store').innerHTML = `מסנכרן את <strong>${escapeHtml(store.dbName || status.storeIdentifier || '')}</strong>` +
      (store.connection && store.connection.url ? ` · ${escapeHtml(store.connection.url)}` : '');
  } else {
    $('store').innerHTML = '&nbsp;';
  }

  if (!status.storeFound) {
    setButton('blocked', 'סנכרן');
    setStatus(`לא נמצאה חנות בשם "${status.storeIdentifier || ''}" במונגו`, 'err');
    stopPolling();
    return;
  }

  if (running) {
    const done = Number(status.done) || 0;
    const total = Number(status.total) || 0;
    watchedRun = true;
    setButton('running', total ? `${Math.round(done / total * 100)}%` : 'מסנכרן…');
    setStatus(total ? `${done} מתוך ${total} מוצרים` : 'מסנכרן את הקטלוג…');
    startPolling();
  } else {
    stopPolling();

    if (status.state === 'error') {
      setButton('failed', 'נסה שוב');
      setStatus(status.lastError || 'הסנכרון נכשל', 'err');
    } else if (status.state === 'done' && watchedRun) {
      setButton('done', 'סנכרן');
      setStatus(`הסנכרון הושלם${status.productCount != null ? ` · ${status.productCount} מוצרים בקטלוג` : ''}`, 'ok');
    } else {
      setButton('idle', 'סנכרן');
      setStatus(status.productCount != null ? `${status.productCount} מוצרים בקטלוג` : 'מוכן לסנכרון');
    }
  }

  const last = formatTime(status.lastSuccessAt || status.finishedAt);
  $('meta').textContent = last ? `עדכון אחרון: ${last}` : ' ';

  const logs = Array.isArray(status.logs) ? status.logs : [];
  $('logToggle').hidden = logs.length === 0;
  $('logs').textContent = logs.join('\n');
}

// Poll only while a run is actually in flight.
function startPolling() { if (!pollTimer) pollTimer = setInterval(refresh, 4000); }
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

async function refresh() {
  try {
    render(await api('/api/garmin/status'));
  } catch (error) {
    stopPolling();
    setButton('idle', 'סנכרן');
    setStatus(error.message, 'err');
  }
}

async function sync() {
  watchedRun = true;
  setButton('running', 'מסנכרן…');
  setStatus('מתחיל…');
  try {
    await api('/api/garmin/sync', { method: 'POST' });
    await refresh();
    startPolling();
  } catch (error) {
    setButton('failed', 'נסה שוב');
    setStatus(error.message, 'err');
  }
}

$('syncBtn').addEventListener('click', sync);
$('logToggle').addEventListener('click', () => {
  const open = $('logs').classList.toggle('show');
  $('logToggle').textContent = open ? 'הסתר יומן' : 'הצג יומן';
});

refresh();
</script>
</body>
</html>
